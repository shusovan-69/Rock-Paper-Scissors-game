<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock · Paper · Scissors — Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e1a;
    --panel:#131a2e;
    --panel-line:#232b45;
    --player:#4ce0ff;
    --cpu:#ff3e9a;
    --win:#33ffa8;
    --lose:#ff4d4d;
    --tie:#ffc93c;
    --ink:#edeff7;
    --muted:#6c7290;
    --display: 'Press Start 2P', monospace;
    --body: 'Space Grotesk', sans-serif;
  }
 
  *{box-sizing:border-box;}
 
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #17203a 0%, var(--bg) 55%);
    font-family:var(--body);
    color:var(--ink);
    overflow:hidden;
  }
 
  .frame{
    position:relative;
    width:560px;
    max-width:94vw;
    padding:28px 26px 32px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:18px;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
 
  .frame::before{
    /* subtle scanline texture, kept faint so it reads as atmosphere not noise */
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
      transparent 1px, transparent 3px
    );
    border-radius:18px;
    pointer-events:none;
  }
 
  .frame.shake{ animation: shakeFrame 0.42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shakeFrame{
    10%{ transform: translate(-6px,2px) rotate(-0.4deg); }
    20%{ transform: translate(5px,-3px) rotate(0.4deg); }
    30%{ transform: translate(-5px,3px) rotate(-0.3deg); }
    40%{ transform: translate(6px,-2px) rotate(0.3deg); }
    50%{ transform: translate(-4px,2px) rotate(-0.2deg); }
    60%{ transform: translate(4px,-2px) rotate(0.2deg); }
    70%{ transform: translate(-3px,1px); }
    80%{ transform: translate(3px,-1px); }
    100%{ transform: translate(0,0) rotate(0); }
  }
 
  header{ text-align:center; margin-bottom:18px; }
  .eyebrow{
    font-family:var(--body); font-size:11px; letter-spacing:0.22em;
    color:var(--muted); text-transform:uppercase; margin-bottom:8px;
  }
  h1{
    font-family:var(--display); font-size:15px; line-height:1.6;
    margin:0; color:var(--ink);
    text-shadow: 0 0 14px rgba(76,224,255,0.35);
  }
 
  .scoreboard{
    display:flex; justify-content:center; gap:22px;
    margin:16px 0 22px;
    font-family:var(--display); font-size:11px;
  }
  .score-item{ text-align:center; }
  .score-item .label{ color:var(--muted); font-size:8px; letter-spacing:0.1em; margin-bottom:6px; display:block;}
  .score-item .value{ font-size:18px; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); display:inline-block;}
  .score-item.win .value{ color:var(--win); text-shadow:0 0 10px rgba(51,255,168,0.5);}
  .score-item.lose .value{ color:var(--lose); text-shadow:0 0 10px rgba(255,77,77,0.5);}
  .score-item.tie .value{ color:var(--tie); text-shadow:0 0 10px rgba(255,201,60,0.5);}
  .score-item .value.bump{ transform: scale(1.5); }
 
  .arena{
    position:relative;
    height:190px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 8px;
  }
 
  .pod{
    position:relative;
    width:140px; height:140px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #1c2440, #0f1424 72%);
    border:2px solid var(--panel-line);
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .pod.player{ box-shadow: 0 0 0 0 rgba(76,224,255,0); }
  .pod.cpu{ box-shadow: 0 0 0 0 rgba(255,62,154,0); }
  .pod.charging.player{ border-color:var(--player); box-shadow: 0 0 26px 2px rgba(76,224,255,0.45); animation: breathe 0.5s ease-in-out infinite alternate; }
  .pod.charging.cpu{ border-color:var(--cpu); box-shadow: 0 0 26px 2px rgba(255,62,154,0.45); animation: breathe 0.5s ease-in-out infinite alternate; }
  @keyframes breathe{ from{ transform:scale(1); } to{ transform:scale(1.035); } }
 
  .pod .icon{
    font-size:56px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transition: transform 0.18s ease;
  }
  .pod .icon.pop{ animation: pop 0.42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{
    0%{ transform: scale(0.4) rotate(-8deg); }
    55%{ transform: scale(1.28) rotate(4deg); }
    100%{ transform: scale(1) rotate(0); }
  }
  .pod .icon.fading{ animation: fadeShrink 0.5s ease forwards; }
  @keyframes fadeShrink{ to{ transform:scale(0.55); opacity:0.12; filter: blur(1px);} }
  .pod .icon.victorious{ animation: victoryPulse 0.9s ease-in-out infinite; }
  @keyframes victoryPulse{
    0%,100%{ transform:scale(1); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
    50%{ transform:scale(1.12); filter: drop-shadow(0 0 18px currentColor); }
  }
 
  .pod-label{
    position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
    font-family:var(--display); font-size:9px; letter-spacing:0.08em; color:var(--muted);
  }
  .pod.player .pod-label{ color:var(--player); }
  .pod.cpu .pod-label{ color:var(--cpu); }
 
  .clash-zone{
    position:relative;
    width:80px; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .vs{
    font-family:var(--display); font-size:12px; color:var(--muted);
    z-index:2;
  }
 
  .ring{
    position:absolute; top:50%; left:50%;
    width:20px; height:20px;
    margin:-10px 0 0 -10px;
    border-radius:50%;
    border:3px solid var(--ink);
    opacity:0;
    pointer-events:none;
  }
  .ring.burst{ animation: ringBurst 0.6s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes ringBurst{
    0%{ width:20px; height:20px; margin:-10px 0 0 -10px; opacity:0.9; }
    100%{ width:340px; height:340px; margin:-170px 0 0 -170px; opacity:0; }
  }
 
  .shard{
    position:absolute; top:50%; left:50%;
    width:8px; height:8px;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    pointer-events:none;
    opacity:1;
  }
  .shard.fly{ animation: shardFly 0.7s ease-out forwards; }
  @keyframes shardFly{
    to{
      transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      opacity:0;
    }
  }
 
  .confetti{
    position:absolute; top:50%; left:50%;
    width:7px; height:12px;
    pointer-events:none;
  }
  .confetti.fall{ animation: confettiFall 1.1s ease-out forwards; }
  @keyframes confettiFall{
    to{
      transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      opacity:0;
    }
  }
 
  .vignette{
    position:absolute; inset:0;
    border-radius:18px;
    pointer-events:none;
    background: radial-gradient(circle, transparent 45%, rgba(255,77,77,0.5) 140%);
    opacity:0;
  }
  .vignette.flash{ animation: vignetteFlash 0.55s ease-out; }
  @keyframes vignetteFlash{
    0%{ opacity:0.85; }
    100%{ opacity:0; }
  }
 
  .status{
    text-align:center; margin:26px 0 20px;
    font-family:var(--display); font-size:12px;
    min-height:16px;
    color:var(--tie);
    transition: color 0.2s ease;
  }
 
  .controls{
    display:flex; justify-content:center; gap:14px;
  }
  button.move{
    appearance:none; border:none; cursor:pointer;
    width:100px; height:84px;
    border-radius:14px;
    background: linear-gradient(180deg, #1c2440, #131a2e 60%);
    border:1px solid var(--panel-line);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    font-family:var(--body); font-size:11px; letter-spacing:0.04em;
    transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  button.move .glyph{ font-size:28px; }
  button.move:hover:not(:disabled){
    border-color:var(--player);
    box-shadow: 0 0 18px rgba(76,224,255,0.25);
    transform: translateY(-3px);
  }
  button.move:active:not(:disabled){ transform: translateY(0px) scale(0.96); }
  button.move:disabled{ opacity:0.4; cursor:not-allowed; }
 
  .reset{
    display:block; margin:22px auto 0;
    background:none; border:none; cursor:pointer;
    font-family:var(--body); font-size:11px; color:var(--muted);
    text-decoration:underline; text-underline-offset:3px;
  }
  .reset:hover{ color:var(--lose); }
 
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
 
<div class="frame" id="frame">
  <div class="vignette" id="vignette"></div>
 
  <header>
    <div class="eyebrow">Best of infinite</div>
    <h1>ROCK · PAPER · SCISSORS</h1>
  </header>
 
  <div class="scoreboard">
    <div class="score-item win"><span class="label">Win</span><span class="value" id="winScore">0</span></div>
    <div class="score-item lose"><span class="label">Loss</span><span class="value" id="lossScore">0</span></div>
    <div class="score-item tie"><span class="label">Tie</span><span class="value" id="tieScore">0</span></div>
  </div>
 
  <div class="arena">
    <div class="pod player" id="playerPod">
      <span class="icon" id="playerIcon">❓</span>
      <span class="pod-label">YOU</span>
    </div>
 
    <div class="clash-zone" id="clashZone">
      <span class="vs">VS</span>
    </div>
 
    <div class="pod cpu" id="cpuPod">
      <span class="icon" id="cpuIcon">❓</span>
      <span class="pod-label">RIVAL</span>
    </div>
  </div>
 
  <div class="status" id="status">Choose your move</div>
 
  <div class="controls">
    <button class="move" data-choice="rock"><span class="glyph">🪨</span>Rock</button>
    <button class="move" data-choice="paper"><span class="glyph">📄</span>Paper</button>
    <button class="move" data-choice="scissors"><span class="glyph">✂️</span>Scissors</button>
  </div>
 
  <button class="reset" id="resetBtn">Reset score</button>
</div>
 
<script>
const CHOICES = ["rock","paper","scissors"];
const EMOJI = { rock:"🪨", paper:"📄", scissors:"✂️" };
const BEATS = { rock:"scissors", paper:"rock", scissors:"paper" };
 
const els = {
  frame: document.getElementById('frame'),
  vignette: document.getElementById('vignette'),
  playerIcon: document.getElementById('playerIcon'),
  cpuIcon: document.getElementById('cpuIcon'),
  playerPod: document.getElementById('playerPod'),
  cpuPod: document.getElementById('cpuPod'),
  clashZone: document.getElementById('clashZone'),
  status: document.getElementById('status'),
  win: document.getElementById('winScore'),
  loss: document.getElementById('lossScore'),
  tie: document.getElementById('tieScore'),
  buttons: [...document.querySelectorAll('button.move')],
  resetBtn: document.getElementById('resetBtn'),
};
 
let score = { win:0, loss:0, tie:0 };
let busy = false;
let cycleTimer = null;
 
function setButtonsEnabled(enabled){
  els.buttons.forEach(b => b.disabled = !enabled);
}
 
function bumpScore(el){
  el.classList.remove('bump');
  void el.offsetWidth; // restart animation
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 260);
}
 
function spawnRing(){
  const ring = document.createElement('div');
  ring.className = 'ring burst';
  els.clashZone.appendChild(ring);
  ring.addEventListener('animationend', () => ring.remove());
}
 
function spawnShards(originEl, color, count){
  const rect = originEl.getBoundingClientRect();
  const frameRect = els.frame.getBoundingClientRect();
  const originX = rect.left - frameRect.left + rect.width/2;
  const originY = rect.top - frameRect.top + rect.height/2;
  for(let i=0;i<count;i++){
    const shard = document.createElement('div');
    shard.className = 'shard fly';
    shard.style.left = originX + 'px';
    shard.style.top = originY + 'px';
    shard.style.background = color;
    const angle = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*70;
    shard.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    shard.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
    shard.style.setProperty('--rot', (Math.random()*360-180) + 'deg');
    els.frame.appendChild(shard);
    shard.addEventListener('animationend', () => shard.remove());
  }
}
 
function spawnConfetti(originEl, count){
  const rect = originEl.getBoundingClientRect();
  const frameRect = els.frame.getBoundingClientRect();
  const originX = rect.left - frameRect.left + rect.width/2;
  const originY = rect.top - frameRect.top;
  const colors = ['#4ce0ff','#33ffa8','#ffc93c','#ff3e9a','#edeff7'];
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'confetti fall';
    c.style.left = originX + 'px';
    c.style.top = originY + 'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    const dx = (Math.random()*2-1) * 120;
    const dy = 90 + Math.random()*80;
    c.style.setProperty('--dx', dx + 'px');
    c.style.setProperty('--dy', dy + 'px');
    c.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    els.frame.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}
 
function shakeFrame(){
  els.frame.classList.remove('shake');
  void els.frame.offsetWidth;
  els.frame.classList.add('shake');
}
 
function flashVignette(){
  els.vignette.classList.remove('flash');
  void els.vignette.offsetWidth;
  els.vignette.classList.add('flash');
}
 
function play(playerChoice){
  if(busy) return;
  busy = true;
  setButtonsEnabled(false);
  els.status.textContent = 'Rolling...';
  els.status.style.color = 'var(--tie)';
  els.playerPod.classList.add('charging');
  els.cpuPod.classList.add('charging');
 
  let frames = 12;
  const cycle = () => {
    els.playerIcon.textContent = EMOJI[CHOICES[Math.floor(Math.random()*3)]];
    els.cpuIcon.textContent = EMOJI[CHOICES[Math.floor(Math.random()*3)]];
    frames--;
    if(frames > 0){
      const delay = 45 + (12 - frames) * 8;
      cycleTimer = setTimeout(cycle, delay);
    } else {
      reveal(playerChoice, CHOICES[Math.floor(Math.random()*3)]);
    }
  };
  cycle();
}
 
function reveal(playerChoice, cpuChoice){
  els.playerPod.classList.remove('charging');
  els.cpuPod.classList.remove('charging');
 
  els.playerIcon.textContent = EMOJI[playerChoice];
  els.cpuIcon.textContent = EMOJI[cpuChoice];
  els.playerIcon.classList.add('pop');
  els.cpuIcon.classList.add('pop');
  setTimeout(() => {
    els.playerIcon.classList.remove('pop');
    els.cpuIcon.classList.remove('pop');
  }, 420);
 
  spawnRing();
  setTimeout(spawnRing, 90);
 
  let result, color;
  if(playerChoice === cpuChoice){
    result = "IT'S A TIE"; color = 'var(--tie)';
    score.tie++; bumpScore(els.tie); els.tie.textContent = score.tie;
    shakeFrame();
  } else if(BEATS[playerChoice] === cpuChoice){
    result = 'YOU WIN'; color = 'var(--win)';
    score.win++; bumpScore(els.win); els.win.textContent = score.win;
    setTimeout(() => {
      els.cpuIcon.classList.add('fading');
      els.playerIcon.classList.add('victorious');
      els.playerIcon.style.color = 'var(--win)';
      spawnShards(els.cpuPod, getComputedStyle(document.documentElement).getPropertyValue('--cpu'), 10);
      spawnConfetti(els.clashZone, 22);
    }, 120);
  } else {
    result = 'YOU LOSE'; color = 'var(--lose)';
    score.loss++; bumpScore(els.loss); els.loss.textContent = score.loss;
    setTimeout(() => {
      els.playerIcon.classList.add('fading');
      els.cpuIcon.classList.add('victorious');
      els.cpuIcon.style.color = 'var(--lose)';
      spawnShards(els.playerPod, getComputedStyle(document.documentElement).getPropertyValue('--player'), 10);
      shakeFrame();
      flashVignette();
    }, 120);
  }
 
  els.status.textContent = result;
  els.status.style.color = color;
 
  setTimeout(() => {
    busy = false;
    setButtonsEnabled(true);
  }, 700);
}
 
function resetScore(){
  score = { win:0, loss:0, tie:0 };
  els.win.textContent = 0;
  els.loss.textContent = 0;
  els.tie.textContent = 0;
  els.status.textContent = 'Choose your move';
  els.status.style.color = 'var(--tie)';
  els.playerIcon.textContent = '❓';
  els.cpuIcon.textContent = '❓';
  els.playerIcon.className = 'icon';
  els.cpuIcon.className = 'icon';
  els.playerIcon.style.color = '';
  els.cpuIcon.style.color = '';
}
 
els.buttons.forEach(b => b.addEventListener('click', () => play(b.dataset.choice)));
els.resetBtn.addEventListener('click', resetScore);
</script>
 
</body>
</html>
